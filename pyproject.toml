[project]
name = "project-to-markdown"
version = "0.1.0"
description = "Bridge your local projects to free chat LLMs - no API keys needed"
readme = "README.md"
authors = [
    { name = "Dilaferaw", email = "dilaferaw@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "tiktoken>=0.5.0",
]

# This is an application run from source (`python main.py`), not a library to
# install -- tell uv not to build or package it.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
